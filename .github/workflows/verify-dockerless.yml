name: Verify dockerless branch

on:
  push:
    branches:
      - feature/dockerless-local-dev
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pk-dts-backend
    env:
      APP_ENV: dockerless
      NODE_ENV: development
      PRISMA_SCHEMA_PATH: prisma/schema.postgresql.prisma
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/document_tracking?schema=public
      CACHE_DRIVER: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pk-dts-backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate:dockerless
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pk-dts-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pk-dts-frontend/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
